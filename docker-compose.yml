services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/portfolio123
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: portfolio123
      NEO4J_DATABASE: neo4j
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    depends_on:
      - neo4j

volumes:
  neo4j_data:
